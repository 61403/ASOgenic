# Source-to-candidate allowlist for the public local stdio MCP core.
# This manifest is the boundary contract between the public core and the
# private hosted adapter; it is not a mechanism for mirroring private source.
required = [
  "src/asogenic/__init__.py",
  "src/asogenic/aso/__init__.py",
  "src/asogenic/catalog_local_setup.py",
  "src/asogenic/catalog_media.py",
  "src/asogenic/catalog_metadata.py",
  "src/asogenic/catalog_post_launch.py",
  "src/asogenic/catalog_release.py",
  "src/asogenic/catalog_setup.py",
  "src/asogenic/config.py",
  "src/asogenic/context.py",
  "src/asogenic/core_catalog.py",
  "src/asogenic/errors.py",
  "src/asogenic/local_runtime.py",
  "src/asogenic/local_server.py",
  "src/asogenic/logging_config.py",
  "src/asogenic/models/__init__.py",
  "src/asogenic/release.py",
  "src/asogenic/services/__init__.py",
  "src/asogenic/session.py",
  "src/asogenic/tools/__init__.py",
  "pyproject.toml",
  "README.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "SUPPORT.md",
  "tests/test_asc_client_contract.py",
  "tests/test_local_stdio.py",
  "uv.lock",
]

[manifest]
status = "approved"

[build]
status = "approved"
distribution = "asogenic"
version = "1.5.3"
build_backend = "hatchling.build"

[build.approvals]
ownership = true
license = true
provenance = true
tree_history_secret_scan = true
package_manifest_review = true
local_boundary_review = true

[build.evidence]
release_owner = "61403"
approved_at = "2026-11-20"
license = "MIT"
history_scope = "The public repository begins from the generated candidate; no private Git objects are copied."

