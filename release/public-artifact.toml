# This is intentionally optional until the rightsholder approves a license.
# The source file does not exist; export remains usable for review, while the
# build gate requires candidate/ LICENSE before a real build can proceed.
[[files]]
source = "release/public/LICENSE"
destination = "LICENSE"
optional = true

# Candidate-only documentation and package metadata. No private README or docs
# are swept into the export.
[[files]]
source = ".gitignore"

[[files]]
source = "release/public/README.md"
destination = "README.md"

[[files]]
source = "release/public/CONTRIBUTING.md"
destination = "CONTRIBUTING.md"

[[files]]
source = "CODE_OF_CONDUCT.md"

[[files]]
source = "release/public/SECURITY.md"
destination = "SECURITY.md"

[[files]]
source = "SUPPORT.md"

[[files]]
source = "release/public/pyproject.toml"
destination = "pyproject.toml"

# The public repository verifies every PR from its own clean checkout. These
# controls contain no private runtime code and are part of the reviewed source
# distribution so the protection does not disappear after the initial export.
[[files]]
source = "release/public-artifact.toml"
destination = "release/public-artifact.toml"

[[files]]
source = "scripts/verify_public_artifact.py"
destination = "scripts/verify_public_artifact.py"

