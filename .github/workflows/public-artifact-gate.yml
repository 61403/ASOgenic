name: Public artifact gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-public-tree:
    name: public-artifact-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify dependency lock
        run: |
          python -m pip install "uv==0.11.12"
          uv lock --check
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Verify reviewed tree and release prerequisites
        run: |
          python scripts/verify_public_artifact.py verify . --manifest release/public-artifact.toml
          python scripts/verify_public_artifact.py build-check . --manifest release/public-artifact.toml
      - name: Build reviewed artifacts
        run: python scripts/verify_public_artifact.py build . --outdir "$RUNNER_TEMP/dist" --manifest release/public-artifact.toml
      - name: Verify wheel and source distribution
        run: |
          wheel=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          python scripts/verify_public_artifact.py verify-wheel . "$wheel" --manifest release/public-artifact.toml
          python scripts/verify_public_artifact.py verify-sdist . "$sdist" --manifest release/public-artifact.toml
      - name: Smoke-test installed local MCP wheel
        run: |
          wheel=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python scripts/smoke_public_wheel.py "$wheel"
      - name: Run local MCP behavior tests
        run: |
          python -m pip install ".[test]"
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
